[project]
name = "xai-study-demo"
version = "0.1.0"
description = "A Streamlit demonstration of an explainable AI research interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=12,<13",
    "streamlit>=1.60,<2",
    "streamlit-image-coordinates>=0.4,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
